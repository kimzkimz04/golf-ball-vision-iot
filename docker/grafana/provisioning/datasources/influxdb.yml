# เชื่อม Grafana กับ InfluxDB ให้อัตโนมัติ (ไม่ต้องกด Add data source เอง)
# ค่า $INFLUX_* มาจาก environment ของ container ซึ่งอ่านจากไฟล์ .env อีกที
apiVersion: 1

datasources:
  - name: InfluxDB-Golf
    uid: influx-golf
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: $INFLUX_ORG
      defaultBucket: $INFLUX_BUCKET
      timeInterval: 1s
    secureJsonData:
      token: $INFLUX_TOKEN
