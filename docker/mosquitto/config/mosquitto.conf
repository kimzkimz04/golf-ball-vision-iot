# Mosquitto 2.x ปิดการเชื่อมต่อจากภายนอกเป็นค่าเริ่มต้น ต้องประกาศ listener เอง
listener 1883 0.0.0.0

# ใช้ในวง LAN / ZeroTier ของเราเองเท่านั้น จึงยอมให้ต่อแบบไม่ใส่รหัส
# ถ้าจะเปิดออกอินเทอร์เน็ตจริง ให้เปลี่ยนเป็น false แล้วใช้ password_file
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
